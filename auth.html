<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnAI — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
.auth-container{width:100%;max-width:420px;padding:20px}
.auth-card{background:#1e293b;border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.logo{text-align:center;margin-bottom:32px}
.logo span{font-size:2rem}
.logo h1{font-size:1.5rem;font-weight:800;margin-top:8px}
.logo p{color:#94a3b8;font-size:.9rem;margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:24px;background:#334155;border-radius:12px;padding:4px}
.tab{flex:1;padding:10px;border:none;background:transparent;color:#94a3b8;font-weight:600;border-radius:8px;cursor:pointer;transition:.2s}
.tab.active{background:#6366f1;color:#fff}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.85rem;font-weight:500;margin-bottom:6px;color:#cbd5e1}
.form-group input{width:100%;padding:12px 16px;background:#334155;border:1px solid #475569;border-radius:10px;color:#fff;font-size:.95rem;transition:.2s}
.form-group input:focus{outline:none;border-color:#6366f1}
.btn{width:100%;padding:14px;background:#6366f1;color:#fff;border:none;border-radius:10px;font-weight:600;font-size:1rem;cursor:pointer;transition:.2s}
.btn:hover{background:#4f46e5}
.divider{display:flex;align-items:center;gap:16px;margin:24px 0;color:#64748b;font-size:.85rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#475569}
.oauth-btn{width:100%;padding:12px;border:1px solid #475569;background:#334155;color:#fff;border-radius:10px;font-weight:500;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.oauth-btn:hover{background:#475569}
.oauth-btn.google{border-color:#db4437;background:rgba(219,68,55,.1)}
.oauth-btn.google:hover{background:rgba(219,68,55,.2)}
.oauth-btn.apple{border-color:#a3aaae;background:rgba(163,170,174,.1)}
.oauth-btn.apple:hover{background:rgba(163,170,174,.2)}
.error{color:#ef4444;font-size:.85rem;margin-top:4px;display:none}
.success{color:#10b981;font-size:.85rem;margin-top:4px;display:none}
.hidden{display:none}
</style>
</head>
<body>
<div class="auth-container">
  <div class="auth-card">
    <div class="logo">
      <span>🎓</span>
      <h1>LearnAI</h1>
      <p>AI-Powered Tutor & Personalized Learning</p>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('signin')">Sign In</button>
      <button class="tab" onclick="showTab('signup')">Sign Up</button>
    </div>
    
    <!-- Sign In Form -->
    <form id="signinForm" onsubmit="handleSignIn(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signinEmail" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signinPassword" placeholder="••••••••" required minlength="6">
      </div>
      <p class="error" id="signinError"></p>
      <button type="submit" class="btn">Sign In</button>
    </form>
    
    <!-- Sign Up Form -->
    <form id="signupForm" class="hidden" onsubmit="handleSignUp(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="your@gmail.com" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="signupPhone" placeholder="+1 234 567 8900" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="••••••••" required minlength="6">
      </div>
      <p class="error" id="signupError"></p>
      <p class="success" id="signupSuccess"></p>
      <button type="submit" class="btn">Create Account</button>
    </form>
    
    <div class="divider">or continue with</div>
    
    <button class="oauth-btn google" onclick="signInGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Sign in with Google
    </button>
    <button class="oauth-btn apple" onclick="signInApple()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
      Sign in with Apple
    </button>
  </div>
</div>

<script>
const API = window.location.origin + '/api';

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('signinForm').classList.toggle('hidden', tab !== 'signin');
  document.getElementById('signupForm').classList.toggle('hidden', tab !== 'signup');
}

async function handleSignIn(e) {
  e.preventDefault();
  const email = document.getElementById('signinEmail').value;
  const password = document.getElementById('signinPassword').value;
  const err = document.getElementById('signinError');
  try {
    const res = await fetch(API + '/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error; err.style.display = 'block'; return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = '/';
  } catch { err.textContent = 'Network error'; err.style.display = 'block'; }
}

async function handleSignUp(e) {
  e.preventDefault();
  const name = document.getElementById('signupName').value;
  const email = document.getElementById('signupEmail').value;
  const phone = document.getElementById('signupPhone').value;
  const password = document.getElementById('signupPassword').value;
  const err = document.getElementById('signupError');
  const suc = document.getElementById('signupSuccess');
  try {
    const res = await fetch(API + '/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, phone, password }) });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error; err.style.display = 'block'; suc.style.display = 'none'; return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    suc.textContent = 'Account created! Redirecting...';
    suc.style.display = 'block'; err.style.display = 'none';
    setTimeout(() => window.location.href = '/', 1000);
  } catch { err.textContent = 'Network error'; err.style.display = 'block'; }
}

function signInGoogle() { window.location.href = API + '/auth/google'; }
function signInApple() { window.location.href = API + '/auth/apple'; }
</script>
</body>
</html>
