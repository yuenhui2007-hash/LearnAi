<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject — LearnAI</title>
    <meta name="description" content="Cambridge subject topics and notes.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=4">
<link rel="stylesheet" href="css/znotes-style.css?v=4">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>
<script src="js/nav.js?v=4"></script>

    <section class="subject-section">
        <div class="container">
            <div class="subject-header">
                <a href="subjects.html" class="back-btn">← All Subjects</a>
                <h1 id="subjectTitle">Loading...</h1>
                <p id="subjectCode"></p>
            </div>
            <div class="topic-list" id="topicList"></div>
        </div>
    </section>

    <script src="js/theme.js?v=4"></script>
    <script src="js/data.js?v=4"></script>
    <script src="js/app.js?v=4"></script>
    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        var subjectId = params.get('id');
        var subject = typeof subjects !== 'undefined' ? subjects[subjectId] : null;

        if (!subject) {
            document.getElementById('subjectTitle').textContent = 'Subject Not Found';
            document.getElementById('subjectCode').textContent = 'Please check the URL or browse all subjects.';
            return;
        }

        document.getElementById('subjectTitle').textContent = subject.icon + ' ' + subject.name;
        document.getElementById('subjectCode').textContent = subject.code;

        var list = document.getElementById('topicList');
        subject.topics.forEach(function(topic) {
            var completed = Progress.isCompleted(subjectId, topic.id);
            var item = document.createElement('div');
            item.className = 'topic-item';
            var level = topic.alevel && topic.igcse ? 'A-Level & IGCSE' : topic.alevel ? 'A-Level' : 'IGCSE';
            item.innerHTML = '<div><h3>' + (completed ? '\u2713 ' : '') + topic.title + '</h3><p>' + level + '</p></div><a href="notes/' + subjectId + '-' + topic.id + '.html" class="btn btn-primary">View Notes</a>';
            list.appendChild(item);
        });
    })();
    </script>
<script src="js/auth.js?v=4"></script>
<script src="js/mascot.js?v=4"></script>
</body>
</html>
