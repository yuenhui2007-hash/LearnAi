<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject — LearnAI</title>
    <meta name="description" content="Cambridge subject topics and notes.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=12">
<link rel="stylesheet" href="css/znotes-style.css?v=12">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>
<script src="js/nav.js?v=12"></script>

    <section class="subject-section">
        <div class="container">
            <div class="subject-header">
                <a href="subjects.html" id="backLink" class="back-btn">← All Subjects</a>
                <h1 id="subjectTitle">Loading...</h1>
                <p id="subjectCode"></p>
            </div>
            <div id="topicSections"></div>
        </div>
    </section>

    <script src="js/theme.js?v=12"></script>
    <script src="js/data.js?v=12"></script>
    <script src="js/app.js?v=12"></script>
    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        var subjectId = params.get('id');
        var levelFilter = params.get('level');
        var subject = typeof subjects !== 'undefined' ? subjects[subjectId] : null;

        // Set back link based on level
        var backLink = document.getElementById('backLink');
        if (backLink && levelFilter) {
            backLink.href = 'subjects.html?level=' + encodeURIComponent(levelFilter);
            backLink.textContent = '← ' + levelFilter.toUpperCase() + ' Subjects';
        }

        if (!subject) {
            document.getElementById('subjectTitle').textContent = 'Subject Not Found';
            document.getElementById('subjectCode').textContent = 'Please check the URL or browse all subjects.';
            return;
        }

        var titleText = subject.icon + ' ' + subject.name;
        if (levelFilter === 'alevel') titleText += ' — A-Level';
        else if (levelFilter === 'igcse') titleText += ' — IGCSE';
        else if (levelFilter === 'ial') titleText += ' — IAL';
        else if (levelFilter === 'gcse') titleText += ' — GCSE';
        document.getElementById('subjectTitle').textContent = titleText;
        var codeText = subject.code;
        if (levelFilter === 'alevel') {
            var parts = codeText.split('·');
            codeText = parts[0].trim();
        } else if (levelFilter === 'igcse') {
            var parts = codeText.split('·');
            codeText = parts[1] ? parts[1].trim() : codeText;
        } else if (levelFilter === 'ial') {
            var parts = codeText.split('·');
            codeText = parts[0].trim();
        } else if (levelFilter === 'gcse') {
            var parts = codeText.split('·');
            codeText = parts.length >= 3 ? parts[2].trim() : codeText;
        }
        document.getElementById('subjectCode').textContent = codeText;

        var container = document.getElementById('topicSections');

        // Build PapaCambridge past papers URL
        var papaSubjectSlug = subject.name.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        if (papaSubjectSlug === 'maths') papaSubjectSlug = 'mathematics';

        var papaBoardSlug = 'cie-a-level';
        if (levelFilter === 'igcse') {
            papaBoardSlug = 'cie-igcse';
        } else if (levelFilter === 'ial') {
            papaBoardSlug = 'edexcel-a-level';
        } else if (levelFilter === 'igcse_edexcel' || levelFilter === 'edexcel_igcse') {
            papaBoardSlug = 'edexcel-igcse';
        } else if (levelFilter === 'gcse') {
            papaBoardSlug = 'edexcel-gcse';
        } else if (levelFilter === 'ib') {
            papaBoardSlug = 'ib';
        }

        var papersUrl = 'https://www.papacambridge.com/' + papaBoardSlug + '/' + papaSubjectSlug + '/';

        // Tab selector: Notes / Past Year Papers / IAS Guide (Accounting A-Level only)
        var activeTab = 'notes';
        var isAccountingAlevel = (subjectId === 'accounting') && (!levelFilter || levelFilter === 'alevel' || levelFilter === 'ial');
        var tabWrap = document.createElement('div');
        tabWrap.id = 'resourceTabs';
        tabWrap.style.cssText = 'display:flex;gap:12px;margin-bottom:28px;';
        var tabHTML = '<button id="tabNotes" style="flex:1;padding:12px 20px;border-radius:12px;border:2px solid #6366f1;background:#6366f1;color:#fff;font-weight:600;font-size:1rem;cursor:pointer;transition:all 0.2s;">📚 Notes</button>' +
            '<button id="tabPapers" style="flex:1;padding:12px 20px;border-radius:12px;border:2px solid #e0e7ff;background:#fff;color:#6366f1;font-weight:600;font-size:1rem;cursor:pointer;transition:all 0.2s;">📄 Past Year Papers</button>';
        if (isAccountingAlevel) {
            tabHTML += '<button id="tabIAS" style="flex:1;padding:12px 20px;border-radius:12px;border:2px solid #e0e7ff;background:#fff;color:#6366f1;font-weight:600;font-size:1rem;cursor:pointer;transition:all 0.2s;">📋 IAS Guide</button>';
        }
        tabWrap.innerHTML = tabHTML;
        container.appendChild(tabWrap);

        var contentWrap = document.createElement('div');
        contentWrap.id = 'tabContent';
        container.appendChild(contentWrap);

        function setTabStyle(activeId) {
            var tabs = ['tabNotes', 'tabPapers'];
            if (isAccountingAlevel) tabs.push('tabIAS');
            tabs.forEach(function(id) {
                var el = document.getElementById(id);
                if (!el) return;
                if (id === activeId) {
                    el.style.cssText = 'flex:1;padding:12px 20px;border-radius:12px;border:2px solid #6366f1;background:#6366f1;color:#fff;font-weight:600;font-size:1rem;cursor:pointer;transition:all 0.2s;';
                } else {
                    el.style.cssText = 'flex:1;padding:12px 20px;border-radius:12px;border:2px solid #e0e7ff;background:#fff;color:#6366f1;font-weight:600;font-size:1rem;cursor:pointer;transition:all 0.2s;';
                }
            });
        }

        function renderNotes() {
            activeTab = 'notes';
            setTabStyle('tabNotes');
            contentWrap.innerHTML = '';

            // Comprehensive notes banner
            if (subject.comprehensiveNotes) {
                var compSection = document.createElement('div');
                compSection.style.cssText = 'background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);border-radius:16px;padding:24px;margin-bottom:28px;color:#fff;text-align:center;';
                compSection.innerHTML =
                    '<div style="font-size:2rem;margin-bottom:8px;">📚</div>' +
                    '<h3 style="margin:0 0 8px;font-size:1.2rem;">Complete Syllabus Notes</h3>' +
                    '<p style="margin:0 0 16px;opacity:0.9;font-size:0.95rem;">Full A-Level notes with worked examples, case studies & derivations.</p>' +
                    '<a href="' + subject.comprehensiveNotes + '" style="display:inline-block;padding:10px 24px;border-radius:10px;background:#fff;color:#6366f1;font-weight:600;text-decoration:none;">Open Notes</a>';
                contentWrap.appendChild(compSection);
            }

            // A-Level topics (AS + A2)
            var alevelTopics = subject.topics.filter(function(t) { return t.alevel && (!levelFilter || levelFilter === 'alevel'); });
            if (alevelTopics.length > 0) {
                var alevelSection = document.createElement('div');
                alevelSection.className = 'topic-section-group';
                alevelSection.innerHTML = '<h2 class="section-divider">A-Level</h2><div class="topic-list" id="alevelList"></div>';
                contentWrap.appendChild(alevelSection);

                var alevelList = document.getElementById('alevelList');
                alevelTopics.forEach(function(topic) {
                    var completed = Progress.isCompleted(subjectId, topic.id);
                    var item = document.createElement('div');
                    item.className = 'topic-item';
                    var stage = topic.as && topic.a2 ? 'AS & A2' : topic.as ? 'AS Level' : 'A2 Level';
                    var notePath = subject.comprehensiveNotes ? subject.comprehensiveNotes : (topic.alevel && topic.igcse ? 'notes/' + subjectId + '-' + topic.id + '-a.html' : 'notes/' + subjectId + '-' + topic.id + '.html');
                    item.innerHTML = '<div><h3>' + (completed ? '\u2713 ' : '') + topic.title + '</h3><p>' + stage + '</p></div><a href="' + notePath + '" class="btn btn-primary">View Notes</a>';
                    alevelList.appendChild(item);
                });
            }

            // IGCSE topics
            var igcseTopics = subject.topics.filter(function(t) { return t.igcse && (!levelFilter || levelFilter === 'igcse'); });
            if (igcseTopics.length > 0) {
                var igcseSection = document.createElement('div');
                igcseSection.className = 'topic-section-group';
                igcseSection.innerHTML = '<h2 class="section-divider">IGCSE</h2><div class="topic-list" id="igcseList"></div>';
                contentWrap.appendChild(igcseSection);

                var igcseList = document.getElementById('igcseList');
                igcseTopics.forEach(function(topic) {
                    var completed = Progress.isCompleted(subjectId, topic.id);
                    var item = document.createElement('div');
                    item.className = 'topic-item';
                    var notePath = topic.alevel && topic.igcse ? 'notes/' + subjectId + '-' + topic.id + '-igcse.html' : 'notes/' + subjectId + '-' + topic.id + '.html';
                    item.innerHTML = '<div><h3>' + (completed ? '\u2713 ' : '') + topic.title + '</h3><p>IGCSE</p></div><a href="' + notePath + '" class="btn btn-primary">View Notes</a>';
                    igcseList.appendChild(item);
                });
            }

            // IB topics
            var ibTopics = subject.topics.filter(function(t) { return t.ib; });
            if (ibTopics.length > 0 && !levelFilter) {
                var ibSection = document.createElement('div');
                ibSection.className = 'topic-section-group';
                ibSection.innerHTML = '<h2 class="section-divider">IB DP</h2><div class="topic-list" id="ibList"></div>';
                contentWrap.appendChild(ibSection);

                var ibList = document.getElementById('ibList');
                ibTopics.forEach(function(topic) {
                    var completed = Progress.isCompleted(subjectId, topic.id);
                    var item = document.createElement('div');
                    item.className = 'topic-item';
                    var levelText = (topic.hl && topic.sl) ? 'HL & SL' : (topic.hl ? 'HL' : 'SL');
                    var badges = '<span style="display:inline-flex;gap:6px;margin-top:4px;">' +
                        (topic.ib ? '<span style="font-size:0.7rem;padding:2px 8px;border-radius:50px;background:#ede9fe;color:#5b21b6;font-weight:600;">IB</span>' : '') +
                        (topic.hl ? '<span style="font-size:0.7rem;padding:2px 8px;border-radius:50px;background:#dcfce7;color:#166534;font-weight:600;">HL</span>' : '') +
                        (topic.sl ? '<span style="font-size:0.7rem;padding:2px 8px;border-radius:50px;background:#dbeafe;color:#1e40af;font-weight:600;">SL</span>' : '') +
                        '</span>';
                    var notePath = 'notes/' + subjectId + '-' + topic.id + '.html';
                    item.innerHTML = '<div><h3>' + (completed ? '\u2713 ' : '') + topic.title + '</h3><p>' + levelText + '</p>' + badges + '</div><a href="' + notePath + '" class="btn btn-primary">View Notes</a>';
                    ibList.appendChild(item);
                });
            }

            // Edexcel IAL topics
            var edexcelIalTopics = subject.topics.filter(function(t) { return t.edexcel_ial && (!levelFilter || levelFilter === 'ial'); });
            if (edexcelIalTopics.length > 0) {
                var ialSection = document.createElement('div');
                ialSection.className = 'topic-section-group';
                ialSection.innerHTML = '<h2 class="section-divider">IAL</h2><div class="topic-list" id="ialList"></div>';
                contentWrap.appendChild(ialSection);

                var ialList = document.getElementById('ialList');
                edexcelIalTopics.forEach(function(topic) {
                    var completed = Progress.isCompleted(subjectId, topic.id);
                    var item = document.createElement('div');
                    item.className = 'topic-item';
                    var notePath = 'notes/' + subjectId + '-' + topic.id + '-ial.html';
                    item.innerHTML = '<div><h3>' + (completed ? '\u2713 ' : '') + topic.title + '</h3><p>IAL</p></div><a href="' + notePath + '" class="btn btn-primary">View Notes</a>';
                    ialList.appendChild(item);
                });
            }

            // Edexcel IGCSE topics
            var edexcelIgcseTopics = subject.topics.filter(function(t) { return t.edexcel_igcse && (!levelFilter || levelFilter === 'igcse'); });
            if (edexcelIgcseTopics.length > 0) {
                var eiSection = document.createElement('div');
                eiSection.className = 'topic-section-group';
                eiSection.innerHTML = '<h2 class="section-divider">IGCSE</h2><div class="topic-list" id="edexcelIgcseList"></div>';
                contentWrap.appendChild(eiSection);

                var eiList = document.getElementById('edexcelIgcseList');
                edexcelIgcseTopics.forEach(function(topic) {
                    var completed = Progress.isCompleted(subjectId, topic.id);
                    var item = document.createElement('div');
                    item.className = 'topic-item';
                    var notePath = 'notes/' + subjectId + '-' + topic.id + '-igcse.html';
                    item.innerHTML = '<div><h3>' + (completed ? '\u2713 ' : '') + topic.title + '</h3><p>IGCSE</p></div><a href="' + notePath + '" class="btn btn-primary">View Notes</a>';
                    eiList.appendChild(item);
                });
            }

            // Edexcel GCSE topics
            var edexcelGcseTopics = subject.topics.filter(function(t) { return t.edexcel_gcse && (!levelFilter || levelFilter === 'gcse'); });
            if (edexcelGcseTopics.length > 0) {
                var gcseSection = document.createElement('div');
                gcseSection.className = 'topic-section-group';
                gcseSection.innerHTML = '<h2 class="section-divider">GCSE</h2><div class="topic-list" id="gcseList"></div>';
                contentWrap.appendChild(gcseSection);

                var gcseList = document.getElementById('gcseList');
                edexcelGcseTopics.forEach(function(topic) {
                    var completed = Progress.isCompleted(subjectId, topic.id);
                    var item = document.createElement('div');
                    item.className = 'topic-item';
                    var notePath = 'notes/' + subjectId + '-' + topic.id + '-gcse.html';
                    item.innerHTML = '<div><h3>' + (completed ? '\u2713 ' : '') + topic.title + '</h3><p>GCSE</p></div><a href="' + notePath + '" class="btn btn-primary">View Notes</a>';
                    gcseList.appendChild(item);
                });
            }
        }

        function renderPapers() {
            activeTab = 'papers';
            setTabStyle('tabPapers');
            contentWrap.innerHTML = '';

            var section = document.createElement('div');
            section.className = 'topic-section-group';
            section.innerHTML = '<div style="text-align:center;padding:48px 24px;">' +
                '<div style="font-size:3rem;margin-bottom:16px;">📄</div>' +
                '<h3 style="font-size:1.3rem;margin-bottom:8px;">Past Year Papers</h3>' +
                '<p style="color:#64748b;margin-bottom:24px;">Practice with real examination papers and mark schemes.</p>' +
                '<a href="' + papersUrl + '" class="btn btn-primary" style="font-size:1.1rem;padding:14px 32px;">Browse Past Papers</a>' +
                '</div>';
            contentWrap.appendChild(section);
        }

        document.getElementById('tabNotes').onclick = renderNotes;
        document.getElementById('tabPapers').onclick = renderPapers;
        if (isAccountingAlevel && document.getElementById('tabIAS')) {
            document.getElementById('tabIAS').onclick = renderIASGuide;
        }

        function renderIASGuide() {
            activeTab = 'ias';
            setTabStyle('tabIAS');
            contentWrap.innerHTML = '';
            var guideSection = document.createElement('div');
            guideSection.style.cssText = 'background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);border-radius:16px;padding:32px;color:#e2e8f0;';
            guideSection.innerHTML =
                '<div style="text-align:center;margin-bottom:24px;">' +
                '<div style="font-size:3rem;margin-bottom:12px;">📊</div>' +
                '<h2 style="color:#60a5fa;margin-bottom:8px;">A-Level Accounting Complete Guide</h2>' +
                '<p style="color:#94a3b8;">Cambridge 9706 · All IAS Standards & Memorization Formats</p>' +
                '</div>' +
                '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px;">' +
                '<div style="background:#1e293b;padding:16px;border-radius:12px;border:1px solid #334155;">' +
                '<h4 style="color:#34d399;margin-bottom:8px;">📋 Exam Structure</h4>' +
                '<p style="font-size:0.9rem;color:#cbd5e1;">Paper 1 (MCQ), Paper 2 (Structured), Paper 3 (A2 Extended)</p>' +
                '</div>' +
                '<div style="background:#1e293b;padding:16px;border-radius:12px;border:1px solid #334155;">' +
                '<h4 style="color:#fbbf24;margin-bottom:8px;">📐 IAS Formats</h4>' +
                '<p style="font-size:0.9rem;color:#cbd5e1;">IAS 1, 2, 7, 8, 10, 16, 37, 38 · IFRS 15</p>' +
                '</div>' +
                '<div style="background:#1e293b;padding:16px;border-radius:12px;border:1px solid #334155;">' +
                '<h4 style="color:#a78bfa;margin-bottom:8px;">📊 Financial Statements</h4>' +
                '<p style="font-size:0.9rem;color:#cbd5e1;">SOPL, SOFP, SOCIE, SOCF formats</p>' +
                '</div>' +
                '<div style="background:#1e293b;padding:16px;border-radius:12px;border:1px solid #334155;">' +
                '<h4 style="color:#f472b6;margin-bottom:8px;">📈 Key Ratios</h4>' +
                '<p style="font-size:0.9rem;color:#cbd5e1;">Profitability, Liquidity, Gearing, Efficiency</p>' +
                '</div>' +
                '</div>' +
                '<div style="text-align:center;">' +
                '<a href="notes/accounting-a-level-guide.html" style="display:inline-block;padding:14px 32px;border-radius:12px;background:#3b82f6;color:#fff;font-weight:700;font-size:1.1rem;text-decoration:none;transition:all 0.2s;">Open Full IAS Guide →</a>' +
                '<p style="color:#64748b;margin-top:12px;font-size:0.85rem;">Includes all formats, journals, and exam tips for memorization</p>' +
                '</div>';
            contentWrap.appendChild(guideSection);
        }

        renderNotes();
    })();
    </script>
<script src="js/auth.js?v=12"></script>
<script src="js/mascot.js?v=12"></script>
<script src="js/pwa.js?v=12"></script>
</body>
</html>
