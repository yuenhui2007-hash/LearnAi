<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject — LearnAI</title>
    <meta name="description" content="Cambridge subject topics and notes.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo"><span class="logo-icon">🎓</span><span class="logo-text">LearnAI</span></a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="subjects.html" class="nav-link">Subjects</a></li>
                <li><a href="dashboard.html" class="nav-link">My Progress</a></li>
                <li><a href="planner.html" class="nav-link">Planner</a></li>
                <li id="navAuth"><a href="login.html" class="nav-link">Sign In</a></li>
            </ul>
        </div>
    </nav>

    <section class="subject-section">
        <div class="container">
            <div class="subject-header">
                <a href="subjects.html" class="back-btn">← All Subjects</a>
                <h1 id="subjectTitle">Loading...</h1>
                <p id="subjectCode"></p>
            </div>
            <div class="topic-list" id="topicList"></div>
        </div>
    </section>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        var subjectId = params.get('id');
        var subject = window.Subjects ? Subjects[subjectId] : null;

        if (!subject) {
            document.getElementById('subjectTitle').textContent = 'Subject Not Found';
            document.getElementById('subjectCode').textContent = 'Please check the URL or browse all subjects.';
            return;
        }

        document.getElementById('subjectTitle').textContent = subject.icon + ' ' + subject.name;
        document.getElementById('subjectCode').textContent = subject.code;

        var list = document.getElementById('topicList');
        subject.topics.forEach(function(topic) {
            var completed = Progress.isCompleted(subjectId, topic.id);
            var item = document.createElement('div');
            item.className = 'topic-item';
            var level = topic.alevel && topic.igcse ? 'A-Level & IGCSE' : topic.alevel ? 'A-Level' : 'IGCSE';
            item.innerHTML = '<div><h3>' + (completed ? '\u2713 ' : '') + topic.title + '</h3><p>' + level + '</p></div><a href="notes/' + subjectId + '-' + topic.id + '.html" class="btn btn-primary">View Notes</a>';
            list.appendChild(item);
        });
    })();
    </script>
</body>
</html>
