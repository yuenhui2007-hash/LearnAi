          title: "Your AI Personal Assistant",
          content: `<h3>Building a Productivity Partner</h3>
          <p>Your Avatar can be the most reliable assistant you have ever had—available 24/7, never forgets, and adapts to your style. This segment shows you how to configure it for maximum personal productivity.</p>

          <h3>Case Study: Sarah's Morning Transformation</h3>
          <p>Sarah, a product manager at a fintech startup, used to spend 45 minutes every morning checking emails, Slack, and her calendar across three apps. After configuring her Avatar's Daily Briefing, she now gets a single 2-minute voice summary at 07:30 while making coffee. She reclaimed 30 minutes daily—over 120 hours per year—and starts each day with clarity instead of chaos.</p>

          <h3>Core Productivity Functions</h3>
          <ol>
            <li><strong>Task Management:</strong> The Avatar captures tasks from voice, email, or chat and organises them by priority and deadline.</li>
            <li><strong>Calendar Intelligence:</strong> It reviews your calendar, suggests optimal meeting times, blocks focus time, and flags conflicts.</li>
            <li><strong>Information Retrieval:</strong> Instead of searching through files, ask the Avatar. It searches your PKM, emails, and notes instantly.</li>
            <li><strong>Decision Support:</strong> Present a dilemma and the Avatar weighs pros and cons based on your values and past decisions.</li>
            <li><strong>Habit Tracking:</strong> It checks in on your daily habits and celebrates streaks.</li>
          </ol>

          <h3>Framework: The CAPTURE Method</h3>
          <p>Stop relying on your brain as a storage device. Use this framework:</p>
          <ul>
            <li><strong>C</strong>apture immediately — voice, text, photo.</li>
            <li><strong>A</strong>ssign context — work, personal, urgent.</li>
            <li><strong>P</strong>rioritise — Eisenhower matrix: urgent/important.</li>
            <li><strong>T</strong>ime-block — schedule it or it won't happen.</li>
            <li><strong>U</strong>rge check — is this truly your task, or delegable?</li>
            <li><strong>R</strong>eview — daily and weekly triage.</li>
            <li><strong>E</strong>xecute — do the work with full focus.</li>
          </ul>

          <h3>Step-by-Step: Daily Assistant Setup</h3>
          <ol>
            <li>Define your <strong>productivity philosophy</strong> in the Identity Model. Are you a GTD person? A time-blocker? A deep-work devotee?</li>
            <li>Create a <strong>Daily Briefing</strong> workflow. Trigger: 07:00 daily. Output: today's meetings, top 3 priorities, pending tasks, and a weather check.</li>
            <li>Set up a <strong>Capture Shortcut</strong>. On mobile, configure a widget: tap → voice memo → Avatar transcribes and files it.</li>
            <li>Enable <strong>Focus Mode</strong>. Tell the Avatar: "I am focusing for 90 minutes." It silences non-urgent notifications and updates your status.</li>
            <li>Create an <strong>End-of-Day Ritual</strong>. Trigger: 18:00. Output: what you accomplished, what rolls over, and tomorrow's preview.</li>
          </ol>

          <p><strong>Example Morning Briefing:</strong> "Good morning. You have 4 meetings today. The most important is the 10:00 product review. Your top priority is finishing the Q3 report. You have 2 hours of blocked focus time at 14:00. Weather: sunny, 22°C."</p>

          <h3>Real Example: The 2-Minute Rule in Action</h3>
          <p>David Allen's GTD "2-minute rule" states: if a task takes less than 2 minutes, do it now. Your Avatar can auto-detect these. When you say "Remind me to reply to John's email," the Avatar checks: "This looks like a 2-minute task. Shall I draft a reply now?" It saves you from a bloated to-do list full of micro-tasks.</p>`,

          <p>Your Avatar is the ultimate study partner. It creates personalised learning plans, tests your recall, and connects new knowledge to what you already know.</p>

          <h3>Case Study: From Zero to Data Analyst in 12 Weeks</h3>
          <p>Liam, a marketing manager, wanted to transition to data analytics. His Avatar assessed his baseline (basic Excel, no coding), then built a 12-week curriculum. Week 1-2: Python fundamentals via 15-min daily micro-lessons. Week 3-4: Pandas with real company datasets. Week 5-6: SQL with spaced-repetition flashcards. Week 7-8: A portfolio project analysing customer churn. Week 9-10: Statistics and A/B testing. Week 11-12: Interview prep with mock technical questions. Liam landed a data analyst role 3 weeks after finishing. The Avatar tracked 94% retention via active recall quizzes.</p>

          <h3>Framework: The Learning Loop</h3>
          <p>Effective learning is not linear. It follows a cycle:</p>
          <ol>
            <li><strong>Acquire:</strong> Input new material (read, watch, listen).</li>
            <li><strong>Encode:</strong> Process it—summarise, visualise, teach.</li>
            <li><strong>Consolidate:</strong> Sleep and rest fix memories.</li>
            <li><strong>Recall:</strong> Test yourself, don't re-read.</li>
            <li><strong>Apply:</strong> Use it in a real project.</li>

          </ol>

          <h3>Case Study: The Subscription Audit That Saved £2,400/year</h3>

        {
          title: "Goal Setting & OKRs",
          content: `<h3>Turning Dreams into Plans</h3>
          <p>Goals without systems are wishes. Your Avatar helps you set, track, and achieve meaningful objectives.</p>

          <h3>Case Study: How OKRs Helped a Startup Founder Reclaim Her Health</h3>
          <p>Aisha, a SaaS founder, was working 80-hour weeks. Her Avatar suggested a quarterly OKR focused on sustainability. Objective: "Build a company and a body that last." Key Results: (1) Average work week ≤ 55 hours, (2) Exercise 4x/week, (3) Sleep score ≥ 80. Initiatives: hire a virtual assistant, batch meetings to Tuesdays/Thursdays, and block " founder fitness" on calendar. By week 6, Aisha's hours dropped to 52 without revenue impact. Her team's productivity actually rose because she was making clearer decisions. By quarter-end, her sleep score hit 83 and she ran her first 10K.</p>

          <h3>Framework: The OKR Method (with Avatar Intelligence)</h3>
          <ol>
            <li><strong>Objective:</strong> A qualitative, inspirational goal. Example: "Become the healthiest version of myself."</li>
            <li><strong>Key Results:</strong> 2–4 measurable outcomes. Example: "Run a 5K in under 25 minutes," "Sleep 7.5 hours average," "Meditate 5 days/week."</li>
            <li><strong>Initiatives:</strong> The specific actions you take. Example: "Join a running club," "Set a 22:00 screen curfew."</li>
          </ol>
          <p><strong>Avatar Enhancement:</strong> The Avatar auto-links KRs to daily habits, schedules weekly check-ins, and surfaces trend data. If a KR is off-track for 2 weeks, it suggests pivot initiatives before you lose the quarter.</p>

          <h3>Step-by-Step: Quarterly OKR Planning</h3>
          <ol>
            <li>Reflect on last quarter. Ask the Avatar: "What did I achieve? What blocked me? What patterns do you see?"</li>
            <li>Brainstorm 3–5 objectives for next quarter. Be ambitious but realistic.</li>

            <li>Career &amp; Business</li>
