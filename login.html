<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — LearnAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=4">
<link rel="stylesheet" href="css/znotes-style.css?v=4">
<style>
.auth-section { padding: 120px 0 60px; background: #0f172a; min-height: 100vh; }
.auth-container { max-width: 420px; margin: 0 auto; padding: 0 20px; }
.auth-card { background: #1e293b; border-radius: 20px; padding: 40px; }
.auth-card h1 { color: #fff; font-size: 1.8rem; text-align: center; margin-bottom: 8px; }
.auth-subtitle { color: #94a3b8; text-align: center; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; color: #cbd5e1; font-size: .85rem; font-weight: 500; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 12px 16px; background: #334155; border: 1px solid #475569; border-radius: 10px; color: #fff; font-size: .95rem; }
.form-group input:focus { outline: none; border-color: #6366f1; }
.btn-block { width: 100%; }
.btn-lg { padding: 14px; font-size: 1rem; }
.auth-error { color: #ef4444; font-size: .85rem; margin-bottom: 12px; display: none; }
.auth-footer { text-align: center; margin-top: 20px; color: #94a3b8; font-size: .9rem; }
.auth-footer a { color: #6366f1; }
.social-login { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.btn-social { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 10px; font-weight: 600; border: 1px solid #475569; background: #334155; color: #fff; cursor: pointer; }
.btn-social:hover { background: #475569; }
.divider { display: flex; align-items: center; gap: 16px; margin: 20px 0; color: #64748b; font-size: .85rem; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #475569; }
.demo-note { text-align: center; font-size: .75rem; color: #64748b; margin-bottom: 16px; }
</style>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="container nav-container">
    <a href="index.html" class="logo"><span class="logo-icon">🎓</span><span class="logo-text">LearnAI</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
    <ul class="nav-menu" id="navMenu">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="subjects.html" class="nav-link">Subjects</a></li>
      <li><a href="tutor.html" class="nav-link">AI Tutor</a></li>
      <li><a href="academy.html" class="nav-link">AI Academy</a></li>
      <li><a href="dashboard.html" class="nav-link">My Progress</a></li>
      <li id="navAuth"><a href="login.html" class="nav-link">Sign In / Sign Up</a></li>
    </ul>
  </div>
</nav>
<section class="auth-section">
<div class="container auth-container">
<div class="auth-card">
<h1>Welcome Back</h1>
<p class="auth-subtitle">Sign in to save your progress</p>
<div class="demo-note">🔒 All data stays in your browser. No server.</div>
<div class="social-login">
<button class="btn btn-social" onclick="redirectToGoogleLogin()">🔴 Continue with Google</button>
<button class="btn btn-social" onclick="redirectToAppleLogin()">⚫ Continue with Apple</button>
</div>
<div class="divider">or</div>
<form id="loginForm">
<div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@gmail.com" required></div>
<div class="form-group"><label>Password</label><input type="password" id="password" placeholder="••••••••" required minlength="6"></div>
<div class="auth-error" id="error"></div>
<button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
</form>
<div class="auth-footer">
<p>Don't have an account? <a href="register.html">Create Account</a></p>
<p><a href="index.html">← Back to Home</a></p>
</div>
</div>
</div>
</section>
<script src="js/oauth.js"></script>
<script src="js/auth.js?v=4"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
e.preventDefault();
var result = Auth.login(document.getElementById('email').value, document.getElementById('password').value);
if (result.success) {
  var params = new URLSearchParams(window.location.search);
  var redirect = params.get('redirect') || 'dashboard.html';
  window.location.href = redirect;
}
else { document.getElementById('error').textContent = result.error; document.getElementById('error').style.display = 'block'; }
});
</script>
<script src="js/mascot.js?v=5"></script>
</body>
</html>
