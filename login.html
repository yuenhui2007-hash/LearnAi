<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — LearnAI</title>
    <meta name="description" content="Sign in to access Cambridge A-Level and IGCSE study resources.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo"><span class="logo-icon">🎓</span><span class="logo-text">LearnAI</span></a>
        </div>
    </nav>

    <section class="auth-section">
        <div class="container auth-container">
            <div class="auth-card">
                <h1>Welcome Back</h1>
                <p class="auth-subtitle">Sign in to access your Cambridge study resources</p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="auth-error" id="loginError"></div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
                </form>
                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Get Started</a></p>
                    <p style="margin-top:12px"><a href="index.html">← Back to Home</a></p>
                </div>
            </div>
        </div>
    </section>

    <script src="js/auth.js"></script>
    <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const result = Auth.login(email, password);
        if (result.success) {
            const params = new URLSearchParams(window.location.search);
            window.location.href = params.get('redirect') || 'dashboard.html';
        } else {
            const err = document.getElementById('loginError');
            err.textContent = result.error;
            err.style.display = 'block';
        }
    });
    </script>
</body>
</html>
