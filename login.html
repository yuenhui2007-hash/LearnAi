<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
<title>Sign In — LearnAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=4">
<link rel="stylesheet" href="css/znotes-style.css?v=4">
<style>
.auth-section { padding: 120px 0 60px; background: #0f172a; min-height: 100vh; }
.auth-container { max-width: 420px; margin: 0 auto; padding: 0 20px; }
.auth-card { background: #1e293b; border-radius: 20px; padding: 40px; }
.auth-card h1 { color: #fff; font-size: 1.8rem; text-align: center; margin-bottom: 8px; }
.auth-subtitle { color: #94a3b8; text-align: center; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; color: #cbd5e1; font-size: .85rem; font-weight: 500; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 12px 16px; background: #334155; border: 1px solid #475569; border-radius: 10px; color: #fff; font-size: .95rem; }
.form-group input:focus { outline: none; border-color: #6366f1; }
.btn-block { width: 100%; }
.btn-lg { padding: 14px; font-size: 1rem; }
.auth-error { color: #ef4444; font-size: .85rem; margin-bottom: 12px; display: none; }
.auth-footer { text-align: center; margin-top: 20px; color: #94a3b8; font-size: .9rem; }
.auth-footer a { color: #6366f1; }
.social-login { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.btn-social { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 10px; font-weight: 600; border: 1px solid #475569; background: #334155; color: #fff; cursor: pointer; }
.btn-social:hover { background: #475569; }
.divider { display: flex; align-items: center; gap: 16px; margin: 20px 0; color: #64748b; font-size: .85rem; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #475569; }
.demo-note { text-align: center; font-size: .75rem; color: #64748b; margin-bottom: 16px; }
</style>
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<script src="js/nav.js?v=5"></script>
<section class="auth-section">
<div class="container auth-container">
<div class="auth-card">
<h1>Welcome Back</h1>
<p class="auth-subtitle">Sign in to save your progress</p>
<div class="demo-note">🔒 Secured server-side authentication.</div>
<div class="social-login">
<button type="button" class="btn btn-social" onclick="window.location.href='https://learnai-backend-n0df.onrender.com/api/oauth/google'" referrerpolicy="strict-origin-when-cross-origin">🔴 Continue with Google</button>
<button type="button" class="btn btn-social" onclick="window.location.href='https://learnai-backend-n0df.onrender.com/api/oauth/apple'" referrerpolicy="strict-origin-when-cross-origin">⚫ Continue with Apple</button>
</div>
<div class="divider">or</div>
<form id="loginForm">
<div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@gmail.com" required></div>
<div class="form-group"><label>Password</label><input type="password" id="password" placeholder="••••••••" required minlength="6"></div>
<div class="auth-error" id="error"></div>
<button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
</form>
<div class="auth-footer">
<p>Don't have an account? <a href="register.html">Create Account</a></p>
<p><a href="index.html">← Back to Home</a></p>
</div>
</div>
</div>
</section>
<script src="js/theme.js?v=4"></script>
    <script src="js/oauth.js"></script>
<script src="js/auth.js?v=4"></script>
<script src="js/auth-guard.js"></script>
<script>
function showError(msg) {
  var el = document.getElementById('error');
  msg = String(msg).replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  el.textContent = msg;
  el.style.display = 'block';
}
// Display OAuth/form errors from URL
(function(){
  var params = new URLSearchParams(window.location.search);
  var err = params.get('error');
  if (err) showError(decodeURIComponent(err));
})();

document.getElementById('loginForm').addEventListener('submit', async function(e) {
e.preventDefault();
var email = document.getElementById('email').value.trim();
var password = document.getElementById('password').value;
if (!email || email.indexOf('@') === -1) { showError('Please enter a valid email address.'); return; }
if (!password || password.length < 6) { showError('Password must be at least 6 characters.'); return; }
var result = await Auth.login(email, password);
if (result.success) {
  var params = new URLSearchParams(window.location.search);
  var redirect = params.get('redirect') || 'dashboard.html';
  window.location.href = redirect;
}
else { showError(result.error); }
});
</script>
<script src="js/mascot.js?v=4"></script>
<script src="js/pwa.js?v=4"></script>
</body>
</html>
