          <p>Most people use AI for single tasks. The real power comes from chaining prompts into end-to-end processes. This segment shows you how.</p>

            <li><strong>Ad-hoc Prompt:</strong> "Write a thank-you email to Sarah." One input, one output, no memory.</li>
            <li><strong>Templated Prompt:</strong> "Write a thank-you email to [NAME] for [REASON]." Reusable but still manual.</li>
            <li><strong>Semi-Automated Workflow:</strong> Trigger → AI action → Human review → Send. Example: draft email, you approve, then it sends.</li>

            <li><strong>Month 2:</strong> Removed the human gate after 15 flawless runs. Fully automated. Saved all 15 hours.</li>

          <p>Automation breaks. The question is: does it break gracefully? This segment teaches defensive design.</p>

            <li><strong>Data Mismatch:</strong> The input format changed (e.g., a new column in a CSV).</li>
            <li><strong>Rate Limiting:</strong> Too many requests to a service in a short window.</li>
            <li><strong>AI Hallucination:</strong> The Avatar generates incorrect or nonsensical output.</li>

            <li>Add a <strong>fallback action</strong>: If retries fail, send a Slack message to the workflow owner.</li>
            <li>For <strong>AI actions</strong>, enable <strong>output validation</strong>. Define rules: output must contain X, must be under Y words, must reference a real document.</li>
            <li>Add a <strong>human approval gate</strong> for any action that modifies external systems (sending emails, updating CRM).</li>
            <li>Schedule a <strong>weekly health check</strong>. The Avatar emails you a summary of all failures, retries, and fallbacks from the past 7 days.</li>
            <li>Maintain a <strong>runbook</strong> in your PKM: "If Workflow X fails, check Y, then do Z."</li>
          </ol>
          <h3>Case Study: The Black Friday That Almost Broke Everything</h3>
