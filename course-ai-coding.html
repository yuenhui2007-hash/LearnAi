        {
          title: "Your AI Pair Programmer",
          content: `<h3>Coding with an AI Partner</h3>
          <p>AI pair programming transforms how you write, read, and maintain code. Your Avatar understands your codebase, follows your style, and catches bugs before they ship. In 2024, GitHub Copilot users reported a <strong>55% faster completion rate</strong> for routine coding tasks, while 74% of developers said they could focus on more satisfying work.</p>

          <h4>Case Study: Stripe's AI Pair Programming Rollout</h4>
          <p>Stripe deployed AI pair programming across 3,000+ engineers. Results after 6 months:</p>
          <ul>
            <li>30% reduction in time-to-first-PR for new hires</li>
            <li>40% fewer syntax-related code review comments</li>
            <li>Engineers reported higher satisfaction with "boilerplate" tasks</li>
            <li>Unexpected finding: senior engineers used AI <em>more</em> than juniors, for rapid prototyping and exploring unfamiliar APIs</li>
          </ul>

          <h3>What an AI Pair Programmer Can Do</h3>
          <ol>
            <li><strong>Autocomplete on steroids:</strong> Suggests entire functions, not just the next line. Understands context from imports, comments, and surrounding code. Example: typing a JSDoc comment like <code>/** Fetches user profile and caches for 5 min */</code> triggers a full implementation suggestion.</li>
            <li><strong>Code generation:</strong> Turn a description into working code. Example: "Write a Python function that validates UK postcodes using regex, handles whitespace, and returns a normalised string."</li>
            <li><strong>Explanation:</strong> Highlight any code and ask: "What does this do?" Get a plain-English breakdown with edge cases, time complexity, and potential gotchas.</li>
            <li><strong>Refactoring:</strong> "Make this function more readable" or "Convert this to async/await." The Avatar preserves logic while improving structure. It can also suggest design patterns (Factory, Strategy, Observer) where appropriate.</li>
            <li><strong>Test generation:</strong> Automatically writes unit tests covering happy paths, edge cases, and error conditions. Can generate property-based tests with Hypothesis or fuzzing setups.</li>
            <li><strong>Cross-language translation:</strong> "Convert this Python data pipeline to Rust for performance." The Avatar preserves semantics while adapting idioms.</li>
          </ol>

          <h3>The 5-Minute Setup Framework</h3>
          <ol>
            <li><strong>Install:</strong> Zetrix IDE extension for VS Code, JetBrains, Vim, or Neovim.</li>
            <li><strong>Connect:</strong> Link your repository (GitHub/GitLab/Bitbucket) in Integrations. The Avatar indexes your codebase into a semantic graph.</li>
            <li><strong>Configure:</strong> Set language conventions, naming patterns (camelCase vs snake_case), max line length (88 for Black, 100 for Google), docstring format (Google, NumPy, or reStructuredText).</li>
            <li><strong>Test:</strong> Open a file, write a comment describing a function, press Tab. Watch the Avatar generate the implementation.</li>
            <li><strong>Iterate:</strong> Accept, modify, or reject suggestions. The Avatar learns from your corrections.</li>
          </ol>

          <h3>Mindset Framework: Pilot & Copilot</h3>
          <table style="width:100%;border-collapse:collapse;margin:16px 0;">
            <tr style="background:#f1f5f9"><th style="padding:10px;text-align:left;border:1px solid #cbd5e1">You (Pilot)</th><th style="padding:10px;text-align:left;border:1px solid #cbd5e1">AI (Copilot)</th></tr>
            <tr><td style="padding:10px;border:1px solid #e2e8f0">Architectural decisions</td><td style="padding:10px;border:1px solid #e2e8f0">Syntax & boilerplate</td></tr>
            <tr><td style="padding:10px;border:1px solid #e2e8f0">Business logic & requirements</td><td style="padding:10px;border:1px solid #e2e8f0">Implementation patterns</td></tr>
            <tr><td style="padding:10px;border:1px solid #e2e8f0">Code review & approval</td><td style="padding:10px;border:1px solid #e2e8f0">First-pass suggestions</td></tr>
            <tr><td style="padding:10px;border:1px solid #e2e8f0">Security & compliance</td><td style="padding:10px;border:1px solid #e2e8f0">Vulnerability scanning</td></tr>
          </table>
          <p><strong>Golden Rule:</strong> Never commit AI-generated code without reading and understanding every line. The AI is a force multiplier, not a replacement for engineering judgment.</p>`,
          quiz: [
            { q: "In the Stripe case study, what percentage reduction in time-to-first-PR was reported?", options: ["10%", "20%", "30%", "50%"], correct: 2 },
            { q: "Which group used AI pair programming MORE than expected at Stripe?", options: ["Junior engineers", "Senior engineers", "Interns", "DevOps engineers"], correct: 1 },
            { q: "What is the recommended max line length for the Black formatter?", options: ["79", "88", "100", "120"], correct: 1 },
            { q: "Which of these is the PILOT's responsibility?", options: ["Writing boilerplate", "Syntax checking", "Architectural decisions", "Auto-completing imports"], correct: 2 },
            { q: "What should you ALWAYS do before committing AI-generated code?", options: ["Run the linter", "Read and understand every line", "Add more comments", "Increase test coverage to 100%"], correct: 1 }

          passThreshold: 80
        },
        {
          title: "Prompt Engineering for Code",
          content: `<h3>Writing Prompts That Produce Great Code</h3>
          <p>Garbage in, garbage out. The quality of your code depends on the quality of your prompts. A 2023 study by Microsoft Research found that developers who used structured prompting frameworks produced code with <strong>47% fewer bugs</strong> on first generation compared to free-form prompts.</p>

          <h4>Case Study: The "Fix This" Failure</h4>
          <p>A team at a fintech startup spent 3 hours debugging because their prompt was: <em>"Fix this function."</em> The AI removed input validation to "simplify" the code. The fix? A structured prompt: <em>"Fix the off-by-one error in the loop on line 42. Keep all existing input validation. The loop must handle empty arrays."</em> Result: correct fix in 30 seconds.</p>

          <h3>The CODE Prompt Framework</h3>
          <p>Use this framework for every code generation request:</p>
          <ol>
            <li><strong>C – Context:</strong> Provide the file path, language, and relevant imports. <em>"In my utils.py file, which imports re and datetime..."</em></li>
            <li><strong>O – Objective:</strong> Be specific. <em>"Write a function that sanitises user input to prevent XSS attacks."</em></li>
            <li><strong>D – Details:</strong> Specify inputs, outputs, and constraints. <em>"Accept a string. Return a safe string. Do not use external libraries. Handle None gracefully."</em></li>
            <li><strong>E – Examples:</strong> Show expected input/output pairs. This reduces ambiguity dramatically. Include edge cases.</li>
          </ol>

          <h3>Advanced: The RISEN Framework</h3>
          <p>For complex tasks, layer on RISEN:</p>
          <ul>
            <li><strong>R – Role:</strong> "You are a senior Python engineer specialising in data pipelines."</li>
            <li><strong>I – Instructions:</strong> Step-by-step what to do.</li>
            <li><strong>S – Steps:</strong> Numbered breakdown of the implementation.</li>
            <li><strong>E – End goal:</strong> What success looks like.</li>
            <li><strong>N – Narrowing:</strong> Constraints, forbidden approaches, must-haves.</li>
          </ul>

          <h3>Step-by-Step: Crafting a Perfect Code Prompt</h3>
          <ol>
            <li><strong>Identify the task.</strong> Example: "Sort a list of employees by start date, then by last name."</li>
            <li><strong>Add context:</strong> "In my HR module (hr/sorting.py), using Python 3.11. Employee objects have .start_date (datetime) and .last_name (str)."</li>
            <li><strong>Define constraints:</strong> "Do not mutate the original list. Handle None start_dates by placing them last. Use stable sort."</li>
            <li><strong>Provide examples:</strong>
              <pre>Input: [Alice(2023-01-15), Bob(None), Charlie(2022-06-01)]
Output: [Charlie, Alice, Bob]</pre>
            </li>
            <li><strong>Ask for tests:</strong> "Include unit tests using pytest. Cover empty list, single element, all None, and duplicates."</li>
            <li><strong>Review and iterate.</strong> If wrong, isolate the error: "The None handling is reversed. Place Nones last, not first."</li>
          </ol>

          <h3>Anti-Patterns to Avoid</h3>
          <table style="width:100%;border-collapse:collapse;margin:16px 0;">
            <tr style="background:#fee2e2"><th style="padding:10px;text-align:left;border:1px solid #fca5a5">Anti-Pattern</th><th style="padding:10px;text-align:left;border:1px solid #fca5a5">Why It Fails</th><th style="padding:10px;text-align:left;border:1px solid #fca5a5">Better Approach</th></tr>
            <tr><td style="padding:10px;border:1px solid #e2e8f0">"Fix this"</td><td style="padding:10px;border:1px solid #e2e8f0">AI doesn't know what's broken</td><td style="padding:10px;border:1px solid #e2e8f0">"Fix the off-by-one error on line 42"</td></tr>
            <tr><td style="padding:10px;border:1px solid #e2e8f0">500 lines of unrelated context</td><td style="padding:10px;border:1px solid #e2e8f0">Dilutes signal with noise</td><td style="padding:10px;border:1px solid #e2e8f0">Include only relevant functions (50-100 lines)</td></tr>
            <tr><td style="padding:10px;border:1px solid #e2e8f0">No examples</td><td style="padding:10px;border:1px solid #e2e8f0">AI guesses intent</td><td style="padding:10px;border:1px solid #e2e8f0">Provide 2-3 input/output pairs</td></tr>
            <tr><td style="padding:10px;border:1px solid #e2e8f0">Asking for everything at once</td><td style="padding:10px;border:1px solid #e2e8f0">Overwhelms context window</td><td style="padding:10px;border:1px solid #e2e8f0">Break into 2-3 smaller prompts</td></tr>
          </table>`,
          interaction: {
            type: "textarea",
            title: "Prompt Surgery",
            instruction: "Read the bad prompt below, then rewrite it using the CODE framework. Your improved prompt should include Context, Objective, Details, and Examples.\n\n<strong>Bad Prompt:</strong> 'Write a function to process orders.'",
            placeholder: "Rewrite the prompt using the CODE framework...",
            minLength: 80,
            completedText: "Great work! Structuring your prompts will dramatically improve AI output quality."
          }
        },
        {
          title: "Debugging with AI",
          content: `<h3>Finding and Fixing Bugs Faster</h3>
          <p>Debugging is detective work. Your Avatar is Sherlock Holmes with infinite patience and perfect memory. A 2024 JetBrains survey found that developers spend <strong>~25% of their time debugging</strong>. AI-assisted debugging can cut this by 40-60%.</p>

          <h4>Case Study: The Phantom 500 Error</h4>
          <p>A Node.js API randomly returned 500 errors under load. Traditional debugging took 2 days of adding console.log statements. With AI debugging:</p>
          <ol>
            <li>Pasted the stack trace and recent commit diff into the Avatar</li>
            <li>Avatar identified a race condition in the database connection pool</li>
            <li>Suggested adding connection timeout and retry logic</li>
            <li>Provided a regression test simulating high concurrency</li>
            <li>Total time: 45 minutes</li>
          </ol>

          <h3>The DEBUG Debugging Framework</h3>
          <ol>
            <li><strong>D – Describe:</strong> "When I submit the form, the page hangs for 30 seconds then shows a 500 error." Include user actions, expected vs actual behaviour.</li>
            <li><strong>E – Evidence:</strong> Paste the stack trace, log output, or screenshot. Include environment details (OS, language version, framework, recent deployments).</li>
            <li><strong>B – Bound:</strong> "This started after the v2.3 deploy. It only affects Safari. It works locally but fails in production." Narrow the search space.</li>
            <li><strong>U – Uncover:</strong> Ask the Avatar for the 3 most likely causes ranked by probability.</li>
            <li><strong>G – Generate:</strong> For each hypothesis, ask the Avatar to suggest diagnostic code or logging to confirm or rule it out.</li>
          </ol>

          <h3>Advanced Debugging Techniques</h3>
          <ul>
            <li><strong>Diff debugging:</strong> "This worked yesterday. Here is the diff since then. What broke?" The Avatar highlights risky changes, especially in dependencies.</li>
            <li><strong>Log analysis:</strong> Paste 1,000 lines of logs. The Avatar summarises patterns, anomalies, and timelines. Can spot correlation between errors and specific user actions.</li>
            <li><strong>Performance profiling:</strong> Share a CPU or memory profile (flame graph, heap dump). The Avatar identifies bottlenecks and suggests algorithmic or architectural optimisations.</li>
            <li><strong>Replay debugging:</strong> Describe the exact sequence of actions. The Avatar reconstructs the state at each step and identifies where expectations diverge from reality.</li>
            <li><strong>Bisection debugging:</strong> "Given these 50 commits, which one introduced the regression?" The Avatar can suggest a binary search strategy through your history.</li>
          </ul>

          <h3>The Golden Rule of AI Debugging</h3>
          <p><strong>Never blindly apply AI-suggested fixes.</strong> Always understand the root cause before patching. The AI might suggest a fix that masks the symptom without curing the disease. Ask "Why did this break?" before asking "How do I fix it?"</p>

          <h3>Debugging Checklist</h3>
          <ul>
            <li>□ Can you reproduce the bug consistently?</li>
            <li>□ Have you collected the full stack trace and logs?</li>
            <li>□ Have you identified the last known good state?</li>
            <li>□ Have you asked the AI for the 3 most likely causes?</li>
            <li>□ Have you written a test that fails before the fix and passes after?</li>
            <li>□ Have you checked if the fix introduces new issues?</li>
          </ul>`,
          quiz: [
            { q: "According to the JetBrains survey, what percentage of developer time is spent debugging?", options: ["10%", "15%", "25%", "40%"], correct: 2 },
            { q: "In the Phantom 500 Error case study, what was the root cause?", options: ["Memory leak", "Race condition in connection pool", "Incorrect API endpoint", "Missing error handler"], correct: 1 },
            { q: "What does the 'B' in DEBUG stand for?", options: ["Build", "Bound", "Breakpoint", "Browse"], correct: 1 },
            { q: "What should you ALWAYS do before applying an AI-suggested fix?", options: ["Run the test suite", "Understand the root cause", "Check Stack Overflow", "Ask a colleague"], correct: 1 },
            { q: "Which technique involves finding which commit introduced a regression?", options: ["Diff debugging", "Bisection debugging", "Replay debugging", "Log analysis"], correct: 1 }
          ],
          passThreshold: 80
        },
        {
          title: "AI Code Review",
          content: `<h3>Catching Issues Before They Reach Production</h3>
          <p>Code review is essential but time-consuming. A Google study found that engineers spend <strong>~13 hours per week on code review</strong>. Your Avatar performs first-pass reviews in seconds, freeing human reviewers for architecture and design.</p>

          <h4>Case Study: Netflix's AI Review Bot</h4>
          <p>Netflix deployed an AI code review agent that checks every pull request before human review:</p>
          <ul>
            <li>Catches 80% of style violations automatically</li>
            <li>Flags security anti-patterns (hardcoded secrets, unsafe deserialization)</li>
            <li>Detects performance issues: N+1 queries, unbounded recursion, memory leaks</li>
            <li>Reduced average PR review time from 48 hours to 12 hours</li>
            <li>Human reviewers now focus on architecture, business logic, and mentorship</li>
          </ul>

          <h3>Building Your AI Code Review Agent</h3>
          <ol>
            <li>Create a <strong>Code Review Agent</strong> in Agent Studio.</li>
            <li>Upload your <strong>style guide</strong> and <strong>security checklist</strong> to PKM. Example files: "Python-Style-Guide.md" and "Security-Checklist.md."</li>
            <li>Write the system prompt:
              <blockquote>"You are a senior engineer. Review the provided code for: correctness, readability, performance, security, and test coverage. Reference specific lines. Suggest improvements, not just criticisms. Praise what was done well."</blockquote>

            <li>Configure triggers:
              <ul>
                <li>On pull request creation.</li>

              </ul>
            </li>
            <li>The agent produces a structured review report:
              <ul>
                <li>Summary score (1–10) with rationale.</li>
                <li>Critical issues (must fix before merge).</li>
                <li>Warnings (should fix).</li>
                <li>Suggestions (nice to have).</li>
                <li>Positive highlights (what was done well).</li>
                <li>Estimated review effort (quick / moderate / thorough).</li>
              </ul>
            </li>
          </ol>

          <h3>What the Avatar Reviews</h3>
          <table style="width:100%;border-collapse:collapse;margin:16px 0;">
            <tr style="background:#f1f5f9"><th style="padding:10px;text-align:left;border:1px solid #cbd5e1">Category</th><th style="padding:10px;text-align:left;border:1px solid #cbd5e1">Examples</th><th style="padding:10px;text-align:left;border:1px solid #cbd5e1">Severity</th></tr>
            <tr><td style="padding:10px;border:1px solid #e2e8f0">Syntax & Types</td><td style="padding:10px;border:1px solid #e2e8f0">Missing imports, type mismatches, undefined variables</td><td style="padding:10px;border:1px solid #e2e8f0">Critical</td></tr>
            <tr><td style="padding:10px;border:1px solid #e2e8f0">Security</td><td style="padding:10px;border:1px solid #e2e8f0">SQL injection, XSS, hardcoded secrets, insecure deps</td><td style="padding:10px;border:1px solid #e2e8f0">Critical</td></tr>
            <tr><td style="padding:10px;border:1px solid #e2e8f0">Performance</td><td style="padding:10px;border:1px solid #e2e8f0">N+1 queries, unbounded loops, memory leaks</td><td style="padding:10px;border:1px solid #e2e8f0">High</td></tr>
            <tr><td style="padding:10px;border:1px solid #e2e8f0">Style</td><td style="padding:10px;border:1px solid #e2e8f0">Naming, formatting, docstrings, comments</td><td style="padding:10px;border:1px solid #e2e8f0">Low</td></tr>
            <tr><td style="padding:10px;border:1px solid #e2e8f0">Tests</td><td style="padding:10px;border:1px solid #e2e8f0">Untested branches, missing edge cases, low coverage</td><td style="padding:10px;border:1px solid #e2e8f0">High</td></tr>
          </table>

          <h3>Human vs AI Review: The Division of Labour</h3>
          <p><strong>AI handles:</strong> Style, syntax, common anti-patterns, security scans, test coverage gaps, documentation completeness.</p>
          <p><strong>Humans handle:</strong> Architecture decisions, business logic correctness, API design, mentorship, edge cases the AI missed, context the AI lacks (e.g., "This conflicts with the roadmap for Q3").</p>`,
          flashcards: [
            { q: "How many hours per week do engineers spend on code review (Google study)?", a: "~13 hours per week" },
            { q: "What percentage of style violations does Netflix's AI bot catch?", a: "80%" },
            { q: "What does N+1 query problem mean?", a: "Making one query for a list, then one additional query per item instead of a join" },
            { q: "What should human reviewers focus on when AI handles first-pass?", a: "Architecture, business logic, API design, mentorship" },
            { q: "What is a good system prompt for a code review agent?", a: "'You are a senior engineer. Review for correctness, readability, performance, security, and test coverage. Reference specific lines. Suggest improvements, not just criticisms.'" }
          ]
        },
        {
          title: "API Building with AI",
          content: `<h3>From Specification to Endpoint</h3>
          <p>Building APIs is repetitive but critical. Your Avatar generates endpoints, documentation, and tests from a simple description. The global API economy is projected to reach $14 trillion by 2027 — speed and correctness matter.</p>

          <h4>Case Study: From Idea to Production API in 2 Hours</h4>
          <p>A startup needed a booking API for their wellness app. Using AI:</p>
          <ol>
            <li>Wrote a one-paragraph description of the booking flow</li>
            <li>AI generated OpenAPI 3.0 spec, FastAPI implementation, SQLAlchemy models, and Pydantic schemas</li>
            <li>Human review caught missing authentication and rate limiting</li>
            <li>AI added JWT auth, RBAC, and Redis rate limiting in the next prompt</li>
            <li>AI generated pytest suite with 94% coverage</li>
            <li>Deployed to staging, ran load tests, tweaked pool sizes based AI suggestions</li>

          <ol>

            <li><strong>Review:</strong> Check for SQL injection risks, missing auth, incorrect HTTP status codes, and missing validation.</li>
            <li><strong>Document:</strong> "Generate Swagger UI annotations and a README with curl examples for every endpoint."</li>

            <li><strong>Secure:</strong> "Add JWT authentication, role-based access control, rate limiting, and input sanitisation."</li>
            <li><strong>Deploy:</strong> "Generate a Dockerfile, docker-compose.yml, and GitHub Actions CI/CD pipeline."</li>
          </ol>

          <h3>Advanced: GraphQL and gRPC</h3>
          <ul>
            <li><strong>GraphQL:</strong> Describe your data model. The Avatar generates schema, resolvers, and dataloaders for N+1 protection. Example: "A User has many Posts. A Post has many Comments. Generate a GraphQL schema with query pagination and mutation authentication."</li>
            <li><strong>gRPC:</strong> Write a .proto file. The Avatar generates server stubs, client code, interceptors for auth and logging, and streaming examples.</li>
            <li><strong>WebSocket:</strong> "Add a real-time notification WebSocket endpoint that pushes updates when a task status changes."</li>
          </ul>

          <h3>API Security Checklist</h3>
          <ul>
            <li>□ Authentication (JWT, OAuth2, API keys)</li>
            <li>□ Authorisation (RBAC, ABAC, scope validation)</li>

            { q: "Which transport should ALWAYS be used for production APIs?", options: ["HTTP", "HTTPS", "FTP", "WebSocket"], correct: 1 }
          ],

        {
          title: "No-Code & Low-Code Development",
          content: `<h3>Building Without Writing Code</h3>

          <p>A 200-person company needed an employee onboarding portal. Instead of hiring developers:</p>

          <h3>The Platform Selection Framework</h3>
          <table style="width:100%;border-collapse:collapse;margin:16px 0;">
