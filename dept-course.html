<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Department Course — LearnAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=7">
<link rel="stylesheet" href="css/znotes-style.css?v=7">
<style>
.dept-hero {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #3730a3 100%);
  color: white;
  padding: 100px 0 60px;
  text-align: center;
}
.dept-hero h1 {
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: 800;
  margin-bottom: 8px;
}
.dept-hero p {
  opacity: 0.85;
  max-width: 600px;
  margin: 0 auto;
  font-size: 1.05rem;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #a5b4fc;
  text-decoration: none;
  margin-bottom: 16px;
  font-size: 0.9rem;
}
.back-link:hover { color: #fff; }

.quiz-section, .assignment-section {
  padding: 60px 0;
  max-width: 800px;
  margin: 0 auto;
}
.quiz-section { background: #f8fafc; }
.assignment-section { background: #fff; }

.section-label {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #6366f1;
  font-weight: 700;
  margin-bottom: 8px;
}
.section-heading {
  font-size: 1.6rem;
  margin-bottom: 24px;
  color: #1e293b;
}

.quiz-card {
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  border: 1px solid #e2e8f0;
}
.quiz-card h4 {
  font-size: 0.95rem;
  margin-bottom: 14px;
  color: #1e293b;
  font-weight: 600;
}
.quiz-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.quiz-opt {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
  background: #f8fafc;
}
.quiz-opt:hover {
  background: #e0e7ff;
  border-color: #c7d2fe;
}
.quiz-opt.selected {
  background: #e0e7ff;
  border-color: #6366f1;
}
.quiz-opt.correct {
  background: #dcfce7;
  border-color: #10b981;
}
.quiz-opt.wrong {
  background: #fee2e2;
  border-color: #dc2626;
}
.quiz-opt input { accent-color: #6366f1; }
.quiz-opt label {
  flex: 1;
  cursor: pointer;
  font-size: 0.92rem;
  color: #334155;
}
.quiz-feedback {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 0.88rem;
  display: none;
}
.quiz-feedback.show { display: block; }
.quiz-feedback.correct { background: #dcfce7; color: #065f46; }
.quiz-feedback.wrong { background: #fee2e2; color: #7f1d1d; }

.assignment-block {
  background: #f8fafc;
  border-radius: 16px;
  padding: 28px;
  border: 1px solid #e2e8f0;
}
.assignment-block h3 {
  font-size: 1.1rem;
  margin-bottom: 10px;
  color: #1e293b;
}
.assignment-block p {
  color: #64748b;
  font-size: 0.92rem;
  line-height: 1.6;
  margin-bottom: 16px;
}
.assignment-textarea {
  width: 100%;
  padding: 16px;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  background: #fff;
  color: #1e293b;
  font-family: inherit;
  font-size: 0.95rem;
  line-height: 1.6;
  min-height: 240px;
  resize: vertical;
}
.assignment-textarea:focus {
  outline: none;
  border-color: #6366f1;
}
.assignment-actions {
  display: flex;
  gap: 12px;
  margin-top: 16px;
}
.ai-result {
  margin-top: 24px;
  padding: 24px;
  background: #fff;
  border-radius: 14px;
  border-left: 4px solid #6366f1;
  box-shadow: 0 2px 16px rgba(0,0,0,0.05);
}
.ai-result h4 {
  font-size: 1rem;
  margin-bottom: 10px;
  color: #1e293b;
}
.score-pill {
  display: inline-block;
  padding: 8px 18px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 1.05rem;
  margin-bottom: 14px;
}
.score-pill.excellent { background: #dcfce7; color: #065f46; }
.score-pill.good { background: #dbeafe; color: #1e3a8a; }
.score-pill.average { background: #fef3c7; color: #78350f; }
.score-pill.poor { background: #fee2e2; color: #7f1d1d; }
.rubric-row {
  padding: 8px 0;
  border-bottom: 1px solid #e2e8f0;
  font-size: 0.88rem;
  color: #475569;
}
.rubric-row:last-child { border-bottom: none; }
.rubric-row strong { color: #1e293b; }

.container-narrow {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 24px;
}

@media (max-width: 640px) {
  .quiz-section, .assignment-section { padding: 40px 0; }
  .container-narrow { padding: 0 16px; }
}
</style>
</head>

const params = new URLSearchParams(window.location.search);
const deptId = params.get('dept');
const dept = corpDepts.find(d => d.id === deptId);

function getProgressKey(key) { return `learnai_dept_${deptId}_${key}`; }
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(getProgressKey('progress')) || '{}'); }
  catch(e) { return {}; }
}
function saveProgress(data) {
  localStorage.setItem(getProgressKey('progress'), JSON.stringify(data));
}

const progress = loadProgress();

if (!dept) {
  document.getElementById('deptTitle').textContent = 'Department Not Found';
  document.getElementById('deptDesc').textContent = 'Please select a valid department from the Academy page.';
} else {
  document.getElementById('deptTitle').textContent = `${dept.icon} ${dept.name}`;
  document.getElementById('deptDesc').textContent = dept.desc;
  document.getElementById('quizHeading').textContent = `${dept.quiz.length} Questions`;
  document.getElementById('assignmentText').textContent = dept.assignment;
  renderQuiz();
  if (progress.assignmentScore !== undefined) {
    document.getElementById('assignmentInput').value = progress.assignmentText || '';
    showStoredAssignmentResult();
  }
}

let quizAnswers = {};

function renderQuiz() {
  const area = document.getElementById('quizContent');
  let html = '';
  dept.quiz.forEach((q, i) => {
    html += `<div class="quiz-card" id="qq-${i}">
      <h4>${i + 1}. ${q.q}</h4>
      <div class="quiz-options">`;
    q.options.forEach((opt, j) => {
      html += `<div class="quiz-opt" id="qqo-${i}-${j}" onclick="selectAnswer(${i}, ${j})">
        <input type="radio" name="qq-${i}" id="qqr-${i}-${j}">
        <label for="qqr-${i}-${j}">${opt}</label>
      </div>`;
    });
    html += `</div><div class="quiz-feedback" id="qqf-${i}"></div></div>`;
  });
  html += `<button class="btn btn-primary" style="margin-top:8px;width:100%;padding:14px;" onclick="submitQuiz()">Submit Quiz</button>`;
  area.innerHTML = html;
}

function selectAnswer(qIdx, optIdx) {
  quizAnswers[qIdx] = optIdx;
  const qEl = document.getElementById(`qq-${qIdx}`);
  qEl.querySelectorAll('.quiz-opt').forEach((el, j) => {
    el.classList.toggle('selected', j === optIdx);
  });
}

function submitQuiz() {
  let correct = 0;
  const answers = [];
  dept.quiz.forEach((q, i) => {
    answers.push(quizAnswers[i]);
    const userAns = quizAnswers[i];
    const userAns = quizAnswers[i];
    const isCorrect = userAns === q.a;
    if (isCorrect) correct++;
    const qEl = document.getElementById(`qq-${i}`);
    qEl.querySelectorAll('.quiz-opt').forEach((el, j) => {
      el.classList.remove('selected');
      if (j === q.a) el.classList.add('correct');
      else if (j === userAns && !isCorrect) el.classList.add('wrong');
      el.style.pointerEvents = 'none';
    });
    const fb = document.getElementById(`qqf-${i}`);
    fb.classList.add('show');
    fb.className = 'quiz-feedback show ' + (isCorrect ? 'correct' : 'wrong');
    fb.innerHTML = isCorrect ? '✓ Correct!' : `✗ Incorrect. Correct answer: <strong>${q.options[q.a]}</strong>`;
  });
  const pct = Math.round((correct / dept.quiz.length) * 100);
  const res = document.getElementById('quizResult');
  res.innerHTML = `<div style="padding:20px;background:#f8fafc;border-radius:12px;text-align:center;margin-top:16px;">
    <div style="font-size:2rem;font-weight:700;color:${pct >= 80 ? '#059669' : pct >= 60 ? '#d97706' : '#dc2626'};">${correct} / ${dept.quiz.length}</div>
    <div style="color:#64748b;margin-top:6px;">${pct}% — ${pct >= 80 ? 'Excellent!' : pct >= 60 ? 'Good job.' : 'Review and try again.'}</div>
    <div style="color:#059669;font-size:0.85rem;margin-top:8px;font-weight:600;">✓ Progress saved</div>
  </div>`;
  progress.quizCorrect = correct;
  progress.quizTotal = dept.quiz.length;
  progress.quizPct = pct;
  progress.quizAnswers = answers;
  progress.quizCompletedAt = new Date().toISOString();
  saveProgress(progress);
}

  const input = document.getElementById('assignmentInput').value.trim();
  const resultArea = document.getElementById('assignmentResult');
  if (!input || input.length < 50) {
    resultArea.innerHTML = `<div style="color:#dc2626;margin-top:12px;font-size:0.9rem;">Please write at least 50 words before submitting.</div>`;
    return;
  }
  const wordCount = input.split(/\s+/).filter(w => w.length > 0).length;

  progress.assignmentText = input;
  progress.assignmentWordCount = wordCount;

  let score = 0;
  let rubric = [];

  if (wordCount >= 400) { score += 20; rubric.push('<strong>Length (20/20):</strong> Comprehensive and well-developed.'); }
  else if (wordCount >= 300) { score += 15; rubric.push('<strong>Length (15/20):</strong> Adequate, meets minimum.'); }
  else if (wordCount >= 200) { score += 10; rubric.push('<strong>Length (10/20):</strong> Brief, could expand.'); }
  else { score += 5; rubric.push('<strong>Length (5/20):</strong> Too short, lacks depth.'); }

  const hasNumbers = /\(\s*\d+\s*\)/.test(input) || /\d+\./.test(input) || /\d+\)/.test(input);
  const hasSections = input.split(/\n/).filter(l => l.trim().length > 0).length >= 4;
  if (hasNumbers && hasSections) { score += 20; rubric.push('<strong>Structure (20/20):</strong> Well-organized with clear numbered sections.'); }
  else if (hasSections) { score += 12; rubric.push('<strong>Structure (12/20):</strong> Some organization but missing clear numbering.'); }
  else { score += 5; rubric.push('<strong>Structure (5/20):</strong> Poorly organized, hard to follow.'); }

  const contentChecks = {
    hr: ['remote','flexibility','productivity','communication','performance','security'],
    finance: ['salary','benefit','expense','budget','training','contingency','personnel'],
    admin: ['onboarding','documentation','workspace','mentor','compliance','schedule'],
    sales: ['value','case study','social proof','objection','call-to-action','demo'],
    marketing: ['audience','KPI','channel','content','budget','social','email'],
    ops: ['defect','root cause','process','quality','timeline','ROI','control'],
    it: ['password','MFA','policy','incident','training','security','data'],
    cs: ['de-escalation','listening','empathy','follow-up','escalate','angry'],
    procurement: ['vendor','evaluation','criteria','risk','negotiation','score'],
    legal: ['consent','privacy','breach','notification','rights','compliance'],
    rnd: ['prototype','milestone','timeline','budget','market','features','metrics'],
    qa: ['test','functional','defect','criteria','schedule','security','performance']
  };
  const checks = contentChecks[dept.id] || [];
  const matched = checks.filter(kw => input.toLowerCase().includes(kw.toLowerCase())).length;
  const coveragePct = Math.round((matched / checks.length) * 100);
  if (coveragePct >= 80) { score += 30; rubric.push(`<strong>Content (30/30):</strong> Excellent — ${matched}/${checks.length} key topics.`); }
  else if (coveragePct >= 50) { score += 20; rubric.push(`<strong>Content (20/30):</strong> Good — ${matched}/${checks.length} key topics.`); }
  else if (coveragePct >= 25) { score += 10; rubric.push(`<strong>Content (10/30):</strong> Fair — ${matched}/${checks.length} key topics.`); }
  else { score += 5; rubric.push(`<strong>Content (5/30):</strong> Weak — ${matched}/${checks.length} key topics.`); }

  const sentences = input.split(/[.!?]+/).filter(s => s.trim().length > 0);
  const avgLen = sentences.length ? sentences.map(s => s.trim().split(/\s+/).length).reduce((a,b) => a+b, 0) / sentences.length : 0;
  const hasProf = /\b(therefore|however|furthermore|additionally|consequently|moreover|in conclusion|specifically|recommended|implementation|strategy|objective)\b/i.test(input);
  if (avgLen >= 12 && avgLen <= 25 && hasProf) { score += 20; rubric.push('<strong>Clarity & Tone (20/20):</strong> Professional, clear, well-articulated.'); }
  else if (hasProf || (avgLen >= 8 && avgLen <= 30)) { score += 14; rubric.push('<strong>Clarity & Tone (14/20):</strong> Generally clear with acceptable tone.'); }
  else { score += 7; rubric.push('<strong>Clarity & Tone (7/20):</strong> Informal or unclear in places.'); }

  const commonErrors = ['teh','recieve','seperate','occured','definately','goverment','accomodate','suprise','untill','wich'];
  const errFound = commonErrors.filter(e => input.toLowerCase().includes(e)).length;
  if (errFound === 0) { score += 10; rubric.push('<strong>Grammar (10/10):</strong> Clean, no obvious errors.'); }
  else if (errFound <= 2) { score += 7; rubric.push(`<strong>Grammar (7/10):</strong> Minor issues (${errFound}).`); }
  else { score += 4; rubric.push(`<strong>Grammar (4/10):</strong> Several issues (${errFound}).`); }

  const grade = score >= 90 ? 'A' : score >= 80 ? 'B+' : score >= 70 ? 'B' : score >= 60 ? 'C+' : score >= 50 ? 'C' : 'D';
  const badgeClass = score >= 80 ? 'excellent' : score >= 60 ? 'good' : score >= 50 ? 'average' : 'poor';

  let feedback = [];
  if (score >= 85) feedback.push('Outstanding work. Strong understanding and professional communication.');
  else if (score >= 70) feedback.push('Good effort. Covers main requirements but could deepen analysis.');
  else if (score >= 55) feedback.push('Adequate. Expand points, use clearer structure, and add more relevant terminology.');
  else feedback.push('Needs significant improvement. Review requirements and resubmit with more detailed, structured content.');

  if (wordCount < 250) feedback.push('Response is shorter than recommended. Aim for 300-500 words.');
  if (!hasNumbers) feedback.push('Consider using numbered points for better readability.');
  if (coveragePct < 50) feedback.push('Response misses several key topics. Review the prompt carefully.');

  resultArea.innerHTML = `
    <div class="ai-result">
      <h4>🤖 AI Marking Result — ${dept.name}</h4>
      <div class="score-pill ${badgeClass}">${score}/100 — Grade ${grade}</div>
      <div style="margin-bottom:12px;color:#334155;font-size:0.95rem;">${feedback.join(' ')}</div>
      <h4 style="color:#64748b;font-size:0.85rem;margin:12px 0 8px;">Rubric Breakdown</h4>
      ${rubric.map(r => `<div class="rubric-row">${r}</div>`).join('')}
      <div style="color:#94a3b8;font-size:0.78rem;margin-top:10px;">Word count: ${wordCount} | Submitted: ${new Date().toLocaleString()}</div>
      <div style="color:#059669;font-size:0.85rem;margin-top:8px;font-weight:600;">✓ Progress saved locally</div>
    </div>
  `;
  progress.assignmentScore = score;
  progress.assignmentGrade = grade;
  progress.assignmentRubric = rubric;
  progress.assignmentFeedback = feedback;
  progress.assignmentSubmittedAt = new Date().toISOString();
  saveProgress(progress);
}

function showStoredAssignmentResult() {
  const resultArea = document.getElementById('assignmentResult');
  if (!progress.assignmentScore !== undefined && progress.assignmentRubric) {
    const badgeClass = progress.assignmentScore >= 80 ? 'excellent' : progress.assignmentScore >= 60 ? 'good' : progress.assignmentScore >= 50 ? 'average' : 'poor';
    resultArea.innerHTML = `
      <div class="ai-result">
        <h4>🤖 Previous AI Marking Result — ${dept.name}</h4>
        <div class="score-pill ${badgeClass}">${progress.assignmentScore}/100 — Grade ${progress.assignmentGrade || 'N/A'}</div>
        <div style="margin-bottom:12px;color:#334155;font-size:0.95rem;">${(progress.assignmentFeedback || []).join(' ')}</div>
        <h4 style="color:#64748b;font-size:0.85rem;margin:12px 0 8px;">Rubric Breakdown</h4>
        ${(progress.assignmentRubric || []).map(r => `<div class="rubric-row">${r}</div>`).join('')}
        <div style="color:#94a3b8;font-size:0.78rem;margin-top:10px;">Word count: ${progress.assignmentWordCount || 0} | Submitted: ${progress.assignmentSubmittedAt ? new Date(progress.assignmentSubmittedAt).toLocaleString() : 'N/A'}</div>
      </div>
    `;
  }
}
</script>
</body>
</html>
