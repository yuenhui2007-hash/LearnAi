<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started — LearnAI</title>
    <meta name="description" content="Create your account to access Cambridge A-Level and IGCSE study resources.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo"><span class="logo-icon">🎓</span><span class="logo-text">LearnAI</span></a>
        </div>
    </nav>

    <section class="auth-section">
        <div class="container auth-container">
            <div class="auth-card">
                <h1>Get Started</h1>
                <p class="auth-subtitle">Join thousands of students achieving A* grades</p>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create a password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="plan">Choose Plan</label>
                        <select id="plan">
                            <option value="monthly">Monthly — $19/month</option>
                            <option value="annual">Annual — $149/year (Save 35%)</option>
                        </select>
                    </div>
                    <div class="auth-error" id="registerError"></div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
                </form>
                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Sign In</a></p>
                    <p style="margin-top:12px"><a href="index.html">← Back to Home</a></p>
                </div>
            </div>
        </div>
    </section>

    <script src="js/auth.js"></script>
    <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const plan = document.getElementById('plan').value;
        const result = Auth.register(email, password, plan);
        if (result.success) {
            window.location.href = 'dashboard.html';
        } else {
            const err = document.getElementById('registerError');
            err.textContent = result.error;
            err.style.display = 'block';
        }
    });
    </script>
</body>
</html>
