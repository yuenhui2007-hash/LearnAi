<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects — LearnAI</title>
    <meta name="description" content="Browse all Cambridge A-Level and IGCSE subjects.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=4">
<link rel="stylesheet" href="css/znotes-style.css?v=4">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>
<script src="js/nav.js?v=4"></script>

    <section class="subjects-section">
        <div class="container">
            <div class="section-header">
                <span class="section-tag">Subjects</span>
                <h2 class="section-title">All Cambridge Subjects</h2>
                <p style="color:var(--gray);margin-top:12px">Complete syllabus coverage for A-Level, IGCSE, and IELTS.</p>
            </div>

            <div class="subjects-filter">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="alevel">A-Level</button>
                <button class="filter-btn" data-filter="igcse">IGCSE</button>
                <button class="filter-btn" data-filter="ielts">IELTS</button>
            </div>

            <div class="subjects-grid" id="subjectsGrid">
                <!-- Filled by JS -->
            </div>
        </div>
    </section>

    <script src="js/theme.js?v=4"></script>
    <script src="js/data.js?v=4"></script>
    <script src="js/app.js?v=4"></script>
    <script src="js/search.js?v=4"></script>
    <script>
    const grid = document.getElementById('subjectsGrid');
    function renderSubjects(filter) {
        grid.innerHTML = '';
        Object.keys(subjects).forEach(key => {
            const s = subjects[key];
            let show = false;
            if (filter === 'all') show = true;
            else if (filter === 'alevel' && s.topics.some(t => t.alevel)) show = true;
            else if (filter === 'igcse' && s.topics.some(t => t.igcse)) show = true;
            else if (filter === 'ielts' && key === 'english') show = true;
            if (!show) return;

            const card = document.createElement('a');
            card.href = 'subject.html?id=' + key;
            card.className = 'subject-card';
            card.dataset.filter = filter === 'all' ? 'all' : filter;
            card.innerHTML = `
                <div class="subject-icon">${s.icon}</div>
                <h3>${s.name}</h3>
                <p>${s.code}</p>
                <span class="subject-tag">${s.topics.length} topics</span>
            `;
            grid.appendChild(card);
        });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            renderSubjects(this.dataset.filter);
        });
    });

    renderSubjects('all');
    </script>
<script src="js/auth.js?v=4"></script>
<script src="js/mascot.js?v=4"></script>
</body>
</html>
