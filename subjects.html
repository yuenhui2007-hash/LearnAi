<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects — LearnAI</title>
    <meta name="description" content="Browse all Cambridge A-Level and IGCSE subjects.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=4">
<link rel="stylesheet" href="css/znotes-style.css?v=4">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>
<script src="js/nav.js?v=5"></script>

    <section class="subjects-section">
        <div class="container">
            <div class="section-header">
                <span class="section-tag">Subjects</span>
                <h2 class="section-title">Browse Subjects</h2>
                <p style="color:var(--gray);margin-top:12px">CAIE (A-Level &amp; IGCSE) and IB syllabus coverage.</p>
            </div>

            <div id="subjectSections"></div>
        </div>
    </section>

    <script src="js/theme.js?v=4"></script>
    <script src="js/data.js?v=4"></script>
    <script src="js/app.js?v=4"></script>
    <script src="js/search.js?v=4"></script>
    <script>
    const container = document.getElementById('subjectSections');

    function createSubjectCard(key, s) {
        const card = document.createElement('a');
        card.href = 'subject.html?id=' + key;
        card.className = 'subject-card';
        card.innerHTML = `
            <div class="subject-icon">${s.icon}</div>
            <h3>${s.name}</h3>
            <p>${s.code}</p>
            <span class="subject-tag">${s.topics.length} topics</span>
        `;
        return card;
    }

    function renderSubsection(title, filterFn) {
        const grid = document.createElement('div');
        grid.className = 'subjects-grid';

        let count = 0;
        Object.keys(subjects).forEach(key => {
            const s = subjects[key];
            if (filterFn(s)) {
                grid.appendChild(createSubjectCard(key, s));
                count++;
            }
        });

        if (count === 0) {
            const empty = document.createElement('p');
            empty.style.color = 'var(--gray)';
            empty.textContent = 'No subjects available.';
            grid.appendChild(empty);
        }

        return { grid, count };
    }

    function renderSection(title, subsections) {
        const section = document.createElement('div');
        section.className = 'topic-section-group';

        const heading = document.createElement('h2');
        heading.className = 'section-divider';
        heading.textContent = title;
        section.appendChild(heading);

        subsections.forEach(function(sub) {
            const subHeading = document.createElement('h3');
            subHeading.style.cssText = 'font-size:1.1rem;font-weight:600;color:var(--text-secondary);margin:24px 0 12px;';
            subHeading.textContent = sub.title;
            section.appendChild(subHeading);

            const result = renderSubsection(sub.title, sub.filter);
            section.appendChild(result.grid);
        });

        container.appendChild(section);
    }

    // CAIE section: A-Level + IGCSE
    renderSection('CAIE', [
        { title: 'A-Level', filter: function(s) { return s.topics.some(function(t) { return t.alevel; }); } },
        { title: 'IGCSE', filter: function(s) { return s.topics.some(function(t) { return t.igcse; }); } }
    ]);

    // IB section
    const ibSection = document.createElement('div');
    ibSection.className = 'topic-section-group';

    const ibHeading = document.createElement('h2');
    ibHeading.className = 'section-divider';
    ibHeading.textContent = 'IB';
    ibSection.appendChild(ibHeading);

    const ibResult = renderSubsection('IB', function(s) {
        return s.topics.some(function(t) { return t.ib; });
    });
    ibSection.appendChild(ibResult.grid);
    container.appendChild(ibSection);
    </script>
<script src="js/auth.js?v=4"></script>
<script src="js/mascot.js?v=4"></script>
<script src="js/pwa.js?v=4"></script>
</body>
</html>
