<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing In — LearnAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.callback-container{text-align:center;padding:40px}
.spinner{width:48px;height:48px;border:4px solid #334155;border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 24px}
@keyframes spin{to{transform:rotate(360deg)}}
.callback-container h1{font-size:1.5rem;margin-bottom:8px}
.callback-container p{color:#94a3b8}
.callback-error{color:#ef4444;margin-top:16px}
</style>
  <script src="js/auth-guard.js"></script>
</head>
<body>
<div class="callback-container">
  <div class="spinner"></div>
  <h1>Signing you in...</h1>
  <p>Please wait while we complete the authentication.</p>
  <div id="error" class="callback-error" style="display:none"></div>
</div>
<script src="js/oauth.js"></script>
<script>
(function(){
  const result = handleOAuthCallback();
  if(result.success){window.location.href='dashboard.html';}
  else{
    document.querySelector('.spinner').style.display='none';
    document.getElementById('error').textContent=result.error;
    document.getElementById('error').style.display='block';
    setTimeout(function(){window.location.href='login.html';},3000);
  }
})();
</script>
</body>
</html>
