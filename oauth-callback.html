<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OAuth Callback — LearnAI</title>
<style>
body { background: #0f172a; color: #fff; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
.container { text-align: center; padding: 40px; }
.spinner { width: 48px; height: 48px; border: 4px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 24px; }
@keyframes spin { to { transform: rotate(360deg); } }
h1 { font-size: 1.5rem; margin-bottom: 8px; }
p { color: #94a3b8; }
.error { color: #ef4444; }
</style>
</head>
<body>
<div class="container">
<div class="spinner"></div>
<h1>Completing Sign In...</h1>
<p>Please wait while we authenticate you.</p>
</div>
<script>
(function() {
  // Check for error
  const params = new URLSearchParams(window.location.search);
  const error = params.get('error');
  if (error) {
    document.querySelector('h1').textContent = 'Authentication Failed';
    document.querySelector('p').textContent = error;
    document.querySelector('p').className = 'error';
    document.querySelector('.spinner').style.display = 'none';
    // Notify opener
    if (window.opener) {
      window.opener.postMessage({ type: 'oauth-error', error: error }, window.location.origin);
    }
    setTimeout(() => window.location.href = '/login.html?error=' + encodeURIComponent(error), 2000);
    return;
  }

  // Backend handles cookie setting, just notify opener and redirect
  if (window.opener) {
    window.opener.postMessage({ type: 'oauth-success', redirect: '/dashboard.html' }, window.location.origin);
  }

  // Redirect to dashboard after short delay
  setTimeout(() => {
    window.location.href = '/dashboard.html';
  }, 1500);
})();
</script>
</body>
</html>
