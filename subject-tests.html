<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subject Practice Tests — LearnAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=8">
<style>
.subject-tests-page { padding: 120px 0 60px; background: #f1f5f9; min-height: 100vh; }
.subject-tests-container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* Hero */
.st-hero { text-align: center; padding: 20px 0 40px; }
.st-hero h1 { font-size: 2.5rem; font-weight: 800; color: #1e293b; margin-bottom: 8px; }
.st-hero p { color: #64748b; font-size: 1.1rem; }
.st-stats { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
.st-stat { text-align: center; }
.st-stat .num { font-size: 1.8rem; font-weight: 800; color: #6366f1; }
.st-stat .lbl { font-size: 0.8rem; color: #64748b; }

/* Subject Grid */
.subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
.subject-card {
  background: #fff; border-radius: 16px; padding: 24px;
  border: 1px solid #e2e8f0; transition: all 0.2s; cursor: pointer;
}
.subject-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.08); border-color: #6366f1; }
.subject-card .sub-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 12px; }
.subject-card h3 { font-size: 1.15rem; margin-bottom: 4px; color: #1e293b; }
.subject-card p { color: #64748b; font-size: 0.85rem; margin-bottom: 12px; }
.subject-card .test-count { font-size: 0.8rem; color: #6366f1; font-weight: 600; }

/* Test List */
.test-list { display: none; background: #fff; border-radius: 16px; padding: 32px; border: 1px solid #e2e8f0; }
.test-list.active { display: block; }
.test-list h2 { margin-bottom: 20px; color: #1e293b; }
.test-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-radius: 12px; border: 1px solid #e2e8f0;
  margin-bottom: 12px; transition: all 0.2s;
}
.test-item:hover { background: #f8fafc; border-color: #6366f1; }
.test-info h4 { font-size: 1rem; margin-bottom: 4px; color: #1e293b; }
.test-info span { font-size: 0.8rem; color: #64748b; }
.test-diff { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; margin-right: 12px; }
.diff-easy { background: #dcfce7; color: #166534; }
.diff-medium { background: #fef3c7; color: #92400e; }
.diff-hard { background: #fee2e2; color: #991b1b; }
.btn-start { padding: 10px 24px; border-radius: 10px; background: linear-gradient(135deg,#6366f1,#818cf8); color: #fff; font-weight: 600; text-decoration: none; font-size: 0.9rem; }
.btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99,102,241,0.3); }
.back-btn { display: inline-flex; align-items: center; gap: 8px; color: #64748b; text-decoration: none; margin-bottom: 20px; font-size: 0.9rem; cursor: pointer; }
.back-btn:hover { color: #1e293b; }
</style>
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<script src="js/nav.js?v=8"></script>

<section class="subject-tests-page">
  <div class="subject-tests-container">

    <!-- Subject Grid -->
    <div id="subjectGrid">
      <div class="st-hero">
        <h1>Subject Practice Tests</h1>
        <p>AI-marked tests across all your subjects with instant feedback</p>
        <div class="st-stats">
          <div class="st-stat"><div class="num" id="statSubjects">14</div><div class="lbl">Subjects</div></div>
          <div class="st-stat"><div class="num" id="statTests">40+</div><div class="lbl">Tests</div></div>
          <div class="st-stat"><div class="num">AI</div><div class="lbl">Marked</div></div>
        </div>
      </div>
      <div class="subject-grid" id="subjectGridInner"></div>
    </div>

    <!-- Test List for Selected Subject -->
    <div class="test-list" id="testList">
      <div class="back-btn" onclick="showSubjects()">← All Subjects</div>
      <h2 id="testListTitle">Tests</h2>
      <div id="testListInner"></div>
    </div>

  </div>
</section>

<script src="js/theme.js?v=8"></script>
<script src="js/auth.js?v=8"></script>
<script src="js/subject-tests.js?v=8"></script>
<script>
const subjectIcons = {
  physics: '⚛️', chemistry: '🧪', biology: '🧬', maths: '📐', 'additional-maths': '📊',
  economics: '📈', geography: '🌍', history: '📜', ict: '💻', business: '📋',
  accounting: '📒', english: '📖', chinese: '中', psychology: '🧠'
};

function renderSubjects() {
  const grid = document.getElementById('subjectGridInner');
  let html = '';
  Object.entries(subjectTestData).forEach(([key, subject]) => {
    const count = subject.tests.length;
    html += `<div class="subject-card" onclick="showTests('${key}')">`;
    html += `<div class="sub-icon" style="background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(129,140,248,0.15))">${subjectIcons[key] || '📝'}</div>`;
    html += `<h3>${subject.name}</h3>`;
    html += `<p>${count} practice test${count > 1 ? 's' : ''} with AI marking</p>`;
    html += `<div class="test-count">${count} test${count > 1 ? 's' : ''} available</div>`;
    html += `</div>`;
  });
  grid.innerHTML = html;
  document.getElementById('statSubjects').textContent = Object.keys(subjectTestData).length;
  let totalTests = 0;
  Object.values(subjectTestData).forEach(s => totalTests += s.tests.length);
  document.getElementById('statTests').textContent = totalTests;
}

function showSubjects() {
  document.getElementById('subjectGrid').style.display = 'block';
  document.getElementById('testList').classList.remove('active');
}

function showTests(subjectKey) {
  const subject = subjectTestData[subjectKey];
  if (!subject) return;
  document.getElementById('subjectGrid').style.display = 'none';
  document.getElementById('testList').classList.add('active');
  document.getElementById('testListTitle').textContent = subject.name + ' Tests';

  const list = document.getElementById('testListInner');
  let html = '';
  subject.tests.forEach(test => {
    const diffClass = test.difficulty === 'Easy' ? 'diff-easy' : test.difficulty === 'Hard' ? 'diff-hard' : 'diff-medium';
    const qCount = test.questions.length;
    const totalMarks = test.questions.reduce((a, q) => a + q.marks, 0);
    html += `<div class="test-item">`;
    html += `<div class="test-info"><h4>${test.title}</h4><span>${qCount} questions · ${totalMarks} marks · ${test.duration} min</span></div>`;
    html += `<div style="display:flex;align-items:center;"><span class="test-diff ${diffClass}">${test.difficulty}</span><a href="subject-test.html?subject=${subjectKey}&test=${test.id}" class="btn-start">Start Test</a></div>`;
    html += `</div>`;
  });
  list.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', renderSubjects);

// URL param handler
const params = new URLSearchParams(window.location.search);
const urlSubject = params.get('subject');
if (urlSubject && subjectTestData[urlSubject]) {
  showTests(urlSubject);
}
</script>
</body>
</html>
